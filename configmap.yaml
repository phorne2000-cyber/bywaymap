apiVersion: v1
kind: PersistentVolume
metadata:
  name: bywaymap-pv
spec:
  capacity:
    storage: 30Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: bywaymap-local-storage
  local:
    path: /mnt/cluster/volumes/bywaymap
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: Exists
