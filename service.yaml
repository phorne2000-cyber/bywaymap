apiVersion: v1
kind: ConfigMap
metadata:
  name: bywaymap-config
  namespace: office
data:
  DATA_DIR: "/data"
  PUBLIC_BASE_URL: "https://bywaymap.hornesys.co.uk"
  OVERPASS_URL: "https://overpass-api.de/api/interpreter"
  UPDATE_HOUR: "3"
  MIN_ZOOM: "7"
  MAX_ZOOM: "16"
  PREGENERATE_MAX_ZOOM: "12"
  TRO_MATCH_METRES: "75"
  DTRO_API_BASE_URL: ""
  DTRO_API_KEY: ""
  DTRO_API_AUTH_HEADER: "Authorization"
  DTRO_API_AUTH_PREFIX: "Bearer"
