@app.on_event("startup")
def startup():
    ensure_dirs()
    load_sources()
    scheduler=BackgroundScheduler()
    scheduler.add_job(update_all, "cron", hour=UPDATE_HOUR, minute=0)
    scheduler.start()
    if not ANALYSED_BYWAYS_PATH.exists():
        threading.Thread(target=update_all, daemon=True).start()
